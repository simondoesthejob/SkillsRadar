name: Terraform plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - "src/**"
      - ".github/workflows/terraform-*.yml"

permissions:
  id-token: write # request the GitHub OIDC token
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    # Skips cleanly until the bootstrap stack has been applied and the variables are set.
    if: ${{ vars.AWS_PLAN_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Init
        working-directory: terraform/envs/dev
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=eu-west-2"
      - name: Plan
        working-directory: terraform/envs/dev
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=60s | tee plan.txt
      - name: Publish plan to the job summary
        if: always()
        run: |
          {
            echo '### Terraform plan (dev)'
            echo '```'
            tail -n 200 terraform/envs/dev/plan.txt 2>/dev/null || echo 'no plan output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
