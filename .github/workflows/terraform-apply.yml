name: Terraform apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "src/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # Jobs using this environment can assume the apply role. Add required reviewers to the
    # 'dev' environment in GitHub settings if you want a manual approval gate.
    environment: dev
    # No job-level `if` on AWS_APPLY_ROLE_ARN: environment variables are not visible to a
    # job-level condition (the environment is attached after it is evaluated), so it would
    # always skip. The role step fails clearly if the variable is missing instead.
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.10"

      - name: Show OIDC subject (debug, remove afterwards)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 - "$TOKEN" <<'PY'
          import sys, base64, json
          p = sys.argv[1].split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print("sub:", c["sub"])
          PY

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Init
        working-directory: terraform/envs/dev
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=eu-west-2"
      - name: Apply
        working-directory: terraform/envs/dev
        run: terraform apply -input=false -auto-approve -lock-timeout=60s