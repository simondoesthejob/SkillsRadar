[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skills-radar"
version = "0.1.0"
description = "Job-market skills radar: ingest, extract, model and visualise skill demand on AWS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # the ingestion Lambda is deliberately dependency-free (boto3 ships with the runtime)

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "boto3>=1.34"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
